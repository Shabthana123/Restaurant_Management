{% extends "base.html" %}
{% block title %}Sign up · RestoDesk{% endblock %}
{% block body %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h3 mb-1">Create a staff account</h1>
  <p class="text-muted">An admin will approve your account before you can log in.</p>
  <form method="post" class="card card-body">
    <label class="form-label" for="fn">Full name</label>
    <input class="form-control mb-3" id="fn" name="full_name" value="{{ form.get('full_name','') }}" required>
    <label class="form-label" for="un">Username</label>
    <input class="form-control mb-3" id="un" name="username" value="{{ form.get('username','') }}" required>
    <label class="form-label" for="rl">Role</label>
    <select class="form-select mb-3" id="rl" name="role">
      {% for r in roles %}<option value="{{ r }}" {{ 'selected' if form.get('role') == r }}>{{ r|capitalize }}</option>{% endfor %}
    </select>
    <label class="form-label" for="pw">Password</label>
    <input class="form-control mb-3" id="pw" name="password" type="password" minlength="8" required>
    <label class="form-label" for="cf">Confirm password</label>
    <input class="form-control mb-3" id="cf" name="confirm" type="password" minlength="8" required>
    <button class="btn btn-tf">Create account</button>
  </form>
  <p class="mt-3 text-muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
